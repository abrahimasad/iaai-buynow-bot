name: IAAI Buy Now Monitor

on:
  schedule:
    - cron: '*/5 * * * *' # كل 5 دقائق (لأن المتصفح يستهلك وقتاً)
  workflow_dispatch:

jobs:
  check-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install chromium

      - name: Restore seen vehicles cache
        uses: actions/cache@v4
        with:
          path: /home/runner/IAAI_BuyNow_Bot/seen_vehicles.json
          key: iaai-seen-vehicles-${{ github.run_id }}
          restore-keys: |
            iaai-seen-vehicles-

      - name: Run script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py
